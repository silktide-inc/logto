<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width; initial-scale=1.0; maximum-scale=1.0; user-scalable=no;">
    <meta http-equiv="X-UA-Compatible" content="IE=9; IE=8; IE=7; IE=EDGE"/>

    <style>
        @import url("https://use.typekit.net/obl6phr.css");

        /* Some resets and issue fixes */
        #outlook a {
            padding: 0;
        }

        body {
            width: 100% !important;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            margin: 0;
            padding: 0;
        }

        table td {
            border-collapse: collapse;
        }

        .ExternalClass * {
            line-height: 115%;
        }

        /* Disable auto-links on GMail */
        u + #body a {
            color: inherit;
            text-decoration: none;
            font-size: inherit;
            font-family: inherit;
            font-weight: inherit;
            line-height: inherit;
        }

        /* Disable auto-links on Apple devices */
        a[x-apple-data-detectors] {
            color: inherit !important;
            text-decoration: none !important;
            font-size: inherit !important;
            font-family: inherit !important;
            font-weight: inherit !important;
            line-height: inherit !important;
        }

        /* Disable auto-links on Samsung devices */
        #MessageViewBody a {
            color: inherit !important;
            text-decoration: none !important;
            font-size: inherit !important;
            font-family: inherit !important;
            font-weight: inherit !important;
            line-height: inherit !important;
        }

        /* Our styles start here */
        .email {
            background: #eef2f4;
            color: #444;
            text-align: center;
            word-break: break-word;
        }

        .emailWrapper {
            max-width: 600px;
            margin: 0 auto;
        }

        .email .img-responsive {
            display: block;
            width: 100%;
            height: auto;
        }

        .email, .email p, .email td, .email th {
            font-family: proxima-nova, Helvetica, Arial, sans-serif;
            color: #444;
        }

        .email p {
            line-height: 22px;
        }

        .email p.lead {
            font-size: 18px;
        }

        .email h1, .email h2, .email h3 {
            color: #000;
            font-family: proxima-nova, Helvetica, Arial, sans-serif;
            font-weight: 600;
        }

        .email h1 {
            font-size: 30px;
            margin: 20px 0 15px;
            line-height: 32px;
        }

        .email h2 {
            font-size: 24px;
            margin: 20px 0 15px;
            line-height: 26px;
        }

        .email h3 {
            font-size: 18px;
            margin: 20px 0 15px;
            line-height: 20px;
        }

        .email h1:first-child, .email h2:first-child, .email h3:first-child {
            margin-top: 0;
        }

        .email h1:last-child, .email h2:last-child, .email h3:last-child, .email p:last-child {
            margin-bottom: 0;
        }

        .email hr {
            margin: 30px 0;
            color: #ccc;
            border-style: dashed;
        }

        .email table {
            border-collapse: collapse;
        }

        .email a {
            color: #533be2;
            text-decoration: underline;
            text-decoration-color: rgba(50, 0, 200, 0.3);
        }

        .email a:hover {
            text-decoration: underline;
        }

        .emailPanel {
            background: #fff;
            border-radius: 0;
            line-height: 18px;
            font-size: 15px;
            margin: 0 5px 20px;
            color: #666;
            padding: 30px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .emailPanel-blurple {
            background: #533be2;
            color: #fff;
        }

        .emailPanel-blurple h1, .emailPanel-blurple h2, .emailPanel-blurple h3, .emailPanel-blurple p, .emailPanel-blurple a
        {
            color: #fff;
        }

        .emailPanel-blurple a {
            text-decoration: underline;
        }

        .email {
            margin: 20px 0;
        }

        .email .code {
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 8px;
            color: #000;
            margin: 30px 0;
        }

        .email {
            border: 0;
            width: 100%;
            text-align: left;
        }

        @media only screen and (max-width: 600px) {
            .emailPanel {
                padding: 20px 10px !important;
            }
        }
    </style>
</head>
<body id="body" bgcolor="#eef2f4">
<div class="email">
    <div class="emailWrapper">
        <table style="border: 0; width: 100%">
            <tr>
                <td style="padding: 20px 10px; text-align: center">
                    <a href="https://login.silktide.com/">
                        <img alt="Silktide" src="https://login.silktide.com/images/silktide-logo.svg" style="width: 100px; height: auto; text-align: center" />
                    </a>
                </td>
            </tr>
        </table>

        <div class="emailPanel emailPanel-blurple" style="margin-bottom: 0;">
            <h1>
                MFA code for Silktide
            </h1>
        </div>

        <div class="emailPanel">
            <p class="lead">
                Your code is:
            </p>

            <p class="code">{{code}}</p>

            <p>This code expires in 10 minutes. If you didn't try to sign in, please change your password immediately.</p>
        </div>

        <p style='padding: 30px; font-size: 12px; color: #888; line-height: 16px'>
            Made by <a href='https://login.silktide.com/' style='color: #666'>Silktide</a>.
            {{ legal_entity_line }}<br>
            Silktide is a registered trademark of {{ legal_trademark_holder }}.
        </p>
    </div>
</div>
</body>
</html>
